services:
  - type: web
    name: blog-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build && npm run db:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTHOR_CLIENT
        sync: false
      - key: PUBLIC_CLIENT
        sync: false
